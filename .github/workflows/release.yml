name: Build and publish binary installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version matching src/package.json, without v'
        required: true
        default: '0.0.15'

permissions:
  contents: read

concurrency:
  group: binary-release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: src
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Validate private source and release version
        id: version
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version || github.ref_name }}
          SOURCE_PRIVATE: ${{ github.event.repository.private }}
        run: node tools/check-release-version.mjs
      - run: npm ci
      - run: npm run check
      - run: npm run test:release
      - name: Test Windows installer running-app choices and resumed setup
        run: npm run test:installer

  build:
    needs: verify
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win
            arch: x64
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: src
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Linux packaging and headless UI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools libfuse2 libgtk-3-0 libnss3 libasound2-dev xvfb
      - run: npm ci
      - run: npm run prepare:runtime
      - run: npm run build:release
      - name: Build installers without automatic publishing
        run: npx --no-install electron-builder --config electron-builder.cjs --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Test actual packaged application
        if: runner.os != 'Linux'
        run: npm run test:package
      - name: Test Windows installer startup confirmation with the packaged app
        if: runner.os == 'Windows'
        env:
          HORNET_PACKAGED_EXECUTABLE: '${{ github.workspace }}/src/release/win-unpacked/Hornet Remote Suite.exe'
          HORNET_INSTALLER_EXECUTABLE: '${{ github.workspace }}/src/release/Hornet-Remote-Suite-${{ needs.verify.outputs.version }}-windows-x64.exe'
        run: npm run test:installer:startup
      - name: Test upgrade from the legacy Windows database
        if: runner.os != 'Linux'
        env:
          HORNET_SMOKE_SCHEMA_EOL: crlf
        run: npm run test:package
      - name: Test actual packaged application on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:package
      - name: Test upgrade from the legacy Windows database on Linux
        if: runner.os == 'Linux'
        env:
          HORNET_SMOKE_SCHEMA_EOL: crlf
        run: xvfb-run -a npm run test:package
      - name: Test terminal clipboard and context menu in the packaged app
        if: runner.os != 'Linux'
        run: npm run test:clipboard:package
      - name: Test terminal pane tabs and live session continuity
        if: runner.os != 'Linux'
        run: npm run test:terminal-tabs:package
      - name: Test terminal pane tabs and live session continuity on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:terminal-tabs:package
      - name: Test integrated title bar and transparent logo
        if: runner.os != 'Linux'
        run: npm run test:titlebar:package
      - name: Test integrated title bar and transparent logo on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:titlebar:package
      - name: Test terminal clipboard and context menu on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:clipboard:package
      - name: Test SSH packet loss and disconnected terminal recovery
        if: runner.os != 'Linux'
        run: npm run test:terminal-disconnect:package
      - name: Test SSH packet loss and disconnected terminal recovery on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:terminal-disconnect:package
      - name: Test session tab commands and saved credentials
        if: runner.os != 'Linux'
        run: npm run test:session-tabs:package
      - name: Test session tab commands and saved credentials on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:session-tabs:package
      - name: Test saved password masking and explicit reveal in the packaged app
        if: runner.os != 'Linux'
        run: npm run test:profile-password:package
      - name: Test saved password masking and explicit reveal on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:profile-password:package
      - name: Test quick commands, toolbars and session properties
        if: runner.os != 'Linux'
        run: npm run test:xshell-workspace:package
      - name: Test quick commands, toolbars and session properties on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:xshell-workspace:package
      - name: Test help, PDF and update checks
        if: runner.os != 'Linux'
        run: npm run test:help:package
      - name: Test help, PDF and update checks on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:help:package
      - name: Test transfer verification and backend responsiveness in the packaged app
        if: runner.os != 'Linux'
        run: npm run test:transfer-reliability:package
      - name: Test transfer verification and backend responsiveness on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:transfer-reliability:package
      - name: Test exit with a nonresponsive backend
        if: runner.os != 'Linux'
        run: npm run test:shutdown:package
      - name: Test exit with a nonresponsive backend on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:shutdown:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            src/release/*.exe
            src/release/*.dmg
            src/release/*.AppImage
            src/release/*.deb
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: [verify, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: src/release-assets
      - name: Publish verified binaries to the public release repository
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: node tools/publish-release.mjs release-assets
